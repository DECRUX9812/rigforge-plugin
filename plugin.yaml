name: rigforge
version: "1.2.0"
description: >-
  Rigforge — the build studio for robots and printed machines. Say what you want
  in one sentence and get the whole build: posed 3D geometry, joint torque sizing
  that picks real servos (or a belt stage when none will do), a per-rail power
  budget with wire gauge, fuse and runtime, an ESP32 pin map that refuses
  strapping and flash pins, firmware generated from that same map, and a priced
  BOM with mass, print time and per-part STL packs that fit YOUR printer bed.
  Ten archetypes from a $100 sensor node and a fab-ready controller board to a
  rover, quadruped, 23-joint humanoid and a metre-scale gantry. Every headline
  number opens into the formula that made it, every change can be compared
  before/after, and a build code carries the whole design in one line. The engine
  is deterministic and offline: geometry, torque, current and cost are computed,
  never narrated.
author: "Ritesh Patel (DECRUX9812), Hermes Agent"
license: MIT
kind: standalone
requires_hermes: ">=0.19"
platforms:
  - linux
  - macos
tags:
  - robotics
  - cad
  - 3d
  - esp32
  - hardware
  - pcb
  - manufacturing
  - desktop
provides_tools:
  - rigforge_build
  - rigforge_state
  - rigforge_prices
provides_hooks: []
provides_middleware: []
requires_env: []
config_schema:
  queue_poll_ms:
    type: integer
    default: 4000
    description: >-
      How often the studio page checks for a build the agent queued. The page
      also polls on focus, so this only bounds idle latency.
